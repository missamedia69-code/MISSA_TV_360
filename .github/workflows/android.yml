name: Android app build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run extension tool tests
        run: python3 -m unittest discover -s extension-tools -p 'test_*.py'

      - name: Run Android unit tests
        run: bash .github/scripts/gradle_ci.sh :app:testDebugUnitTest

      - name: Build debug APK
        run: bash .github/scripts/gradle_ci.sh :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: missa-tv-360-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
