name: Android app build

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  # contents: write est nécessaire pour publier l'APK dans la release "apk-debug".
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  assemble-debug:
    name: Assemble Android TV debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: missa-tv-360-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Publie l'APK dans la release permanente « apk-debug » : un lien de
      # téléchargement stable, sans passer par l'onglet Actions ni par la
      # rétention de 7 jours des artefacts.
      - name: Publish APK to the apk-debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          short="${GITHUB_SHA:0:7}"
          notes="APK debug généré par la CI.
          Dernier build : ${GITHUB_REF_NAME} @ ${short} (run ${GITHUB_RUN_ID}).
          Fichier : app-debug.apk (debug, non signé en release)."
          gh release create apk-debug \
            --target "$GITHUB_SHA" \
            --title "APK debug — build continu" \
            --notes "$notes" || true
          gh release edit apk-debug \
            --target "$GITHUB_SHA" \
            --notes "$notes"
          gh release upload apk-debug "$apk" --clobber
          gh release view apk-debug --json tagName,assets \
            --jq '{tagName, assets: [.assets[] | {name, size}]}'
