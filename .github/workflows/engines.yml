name: Engines & Pages

# Exécute tous les moteurs (engines/*/engine.py) puis publie site/ en GitHub Pages.
# C'est cette CI qui fait du dépôt le « serveur » de l'application :
# elle régénère les JSON de catalogue à chaque push sur main.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine deps
        run: pip install pyyaml

      - name: Run all engines & consolidate catalog
        run: python engines/build_all.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
