name: Extensions

# Construit l'extension d'exemple, la publie comme asset de la release
# `extensions` avec un `plugins.json` généré (sha256 + taille réels), et
# l'expose donc immédiatement à l'application.
#
# Aucune écriture dans le dépôt : la publication passe uniquement par des
# assets de release, ce qui évite tout commit automatique sur `main`
# (voir docs/extensions.md §4).
on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "plugin-api/**"
      - "extensions-src/**"
      - "extension-tools/**"
      - "site/extensions/**"
      - ".github/workflows/extensions.yml"
  pull_request:
    paths:
      - "plugin-api/**"
      - "extensions-src/**"
      - "extension-tools/**"
      - "site/extensions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  # Tag de release servant d'hébergement stable aux .msa et à plugins.json.
  EXTENSION_RELEASE_TAG: "extensions"

jobs:
  build-extensions:
    name: Build .msa and validate plugins.json
    runs-on: ubuntu-latest
    permissions:
      contents: write   # création/mise à jour de la release `extensions`
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier la présence de d8
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK Android : ${sdk:-absent}"
          test -n "$sdk" || { echo "::error::ANDROID_HOME absent : d8 est requis"; exit 1; }
          ls "$sdk/build-tools" || true

      - name: Tests de l'outil de publication
        run: python3 -m unittest discover -s extension-tools -v

      - name: Compiler le contrat plugin
        run: bash ./gradlew --no-daemon :plugin-api:jar

      - name: Construire l'archive de l'extension d'exemple
        run: bash ./gradlew --no-daemon :extensions-src:hello-provider:packagePlugin

      - name: Préparer le dossier de builds
        run: |
          mkdir -p "$RUNNER_TEMP/builds"
          cp extensions-src/hello-provider/build/plugin/*.msa "$RUNNER_TEMP/builds/"
          cp extensions-src/hello-provider/build/plugin/*.json "$RUNNER_TEMP/builds/"
          ls -l "$RUNNER_TEMP/builds"

      - name: Générer plugins.json (sha256 + taille réels)
        run: |
          set -euo pipefail
          python3 extension-tools/build_extension_repo.py \
            --builds-dir "$RUNNER_TEMP/builds" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${EXTENSION_RELEASE_TAG}" \
            --out "$RUNNER_TEMP/plugins.json"
          echo "--- plugins.json généré ---"
          cat "$RUNNER_TEMP/plugins.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(f'{len(d)} extension(s) publiée(s)')" "$RUNNER_TEMP/plugins.json"

      # Sur un push uniquement (jamais depuis une PR) : la release devient la
      # source servie à l'application, donc l'installation au premier
      # démarrage a immédiatement quelque chose à installer.
      - name: Publier la release « extensions »
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.EXTENSION_RELEASE_TAG }}
        run: |
          set -euo pipefail
          notes="Archive d'extension compilée + plugins.json généré par la CI.
          Build : ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7} (run ${GITHUB_RUN_ID}).
          Ne pas modifier à la main : contenu régénéré à chaque build vert."

          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" \
                 --title "Extensions MISSA TV 360" --prerelease \
                 --notes "$notes"
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes "$notes"

          gh release upload "$TAG" "$RUNNER_TEMP"/builds/*.msa --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/plugins.json" --clobber

          echo "Publié : https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/plugins.json"

      - name: Téléverser l'archive
        uses: actions/upload-artifact@v4
        with:
          name: extension-hello-provider
          path: |
            extensions-src/hello-provider/build/plugin/*.msa
            extensions-src/hello-provider/build/plugin/*.json
          if-no-files-found: error
