name: Extensions

# Construit l'extension d'exemple, vérifie la cohérence de `plugins.json`
# et publie l'archive en artefact.
#
# Aucune écriture automatique sur `main` : le commit de l'archive et de
# `plugins.json` reste une décision humaine (voir docs/extensions.md §4).
on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "plugin-api/**"
      - "extensions-src/**"
      - "extension-tools/**"
      - "site/extensions/**"
      - ".github/workflows/extensions.yml"
  pull_request:
    paths:
      - "plugin-api/**"
      - "extensions-src/**"
      - "extension-tools/**"
      - "site/extensions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build-extensions:
    name: Build .msa and validate plugins.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier la présence de d8
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK Android : ${sdk:-absent}"
          test -n "$sdk" || { echo "::error::ANDROID_HOME absent : d8 est requis"; exit 1; }
          ls "$sdk/build-tools" || true

      - name: Tests de l'outil de publication
        run: python3 -m unittest discover -s extension-tools -v

      - name: Compiler le contrat plugin
        run: bash ./gradlew --no-daemon :plugin-api:jar

      - name: Construire l'archive de l'extension d'exemple
        run: bash ./gradlew --no-daemon :extensions-src:hello-provider:packagePlugin

      - name: Préparer le dossier de builds
        run: |
          mkdir -p "$RUNNER_TEMP/builds"
          cp extensions-src/hello-provider/build/plugin/*.msa "$RUNNER_TEMP/builds/"
          cp extensions-src/hello-provider/build/plugin/*.json "$RUNNER_TEMP/builds/"
          ls -l "$RUNNER_TEMP/builds"

      - name: Vérifier que plugins.json est à jour
        run: |
          python3 extension-tools/build_extension_repo.py --check \
            --builds-dir "$RUNNER_TEMP/builds" \
            --base-url https://missamedia69-code.github.io/MISSA_TV_360/extensions/builds \
            --out site/extensions/plugins.json
        continue-on-error: true

      - name: Publier le diagnostic de publication
        run: |
          python3 extension-tools/build_extension_repo.py \
            --builds-dir "$RUNNER_TEMP/builds" \
            --base-url https://missamedia69-code.github.io/MISSA_TV_360/extensions/builds \
            --out "$RUNNER_TEMP/plugins.generated.json"
          echo "--- plugins.json généré ---"
          cat "$RUNNER_TEMP/plugins.generated.json"
          echo "--- plugins.json publié ---"
          cat site/extensions/plugins.json

      - name: Téléverser l'archive
        uses: actions/upload-artifact@v4
        with:
          name: extension-hello-provider
          path: |
            extensions-src/hello-provider/build/plugin/*.msa
            extensions-src/hello-provider/build/plugin/*.json
          if-no-files-found: error
