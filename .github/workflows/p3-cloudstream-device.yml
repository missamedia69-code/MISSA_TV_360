name: P3 Cloudstream device probe

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/p3-cloudstream-device.yml"
      - "app/src/androidTest/**"
      - "app/src/main/java/com/missa/tv360/extensions/**"
      - "cloudstream-compat/**"

permissions:
  contents: read

jobs:
  device:
    name: BuzzMonclick on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch pinned BuzzMonclick fixture
        run: |
          mkdir -p app/src/androidTest/assets
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/zzikozz/frenchCS/contents/BuzzMonclick.cs3?ref=90fbd7d9baa7579be4a6a804e02db6324b0cb1f1' \
            -o app/src/androidTest/assets/BuzzMonclick.cs3
          echo '4024270cb486b718f58bbaa03b8cc9db1e14b94af0a758083e1bcb722dbb2293  app/src/androidTest/assets/BuzzMonclick.cs3' | sha256sum -c -

      - name: Run the real plugin on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disk-size: 4G
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # L'AVD peut être restauré depuis un cache : ne pas conserver un APK
            # signé avec la clé debug éphémère d'une exécution précédente.
            adb uninstall com.missa.tv360.test >/dev/null 2>&1 || true
            adb uninstall com.missa.tv360 >/dev/null 2>&1 || true
            bash .github/scripts/gradle_ci.sh :app:assembleDebug :app:assembleDebugAndroidTest
            status=$?
            if [ "$status" -eq 0 ]; then
              for apk in \
                app/build/outputs/apk/debug/app-debug.apk \
                app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
                if install_output=$(adb install -r -t "$apk" 2>&1); then
                  install_status=0
                else
                  install_status=$?
                fi
                printf '%s\n' "$install_output"
                if [ "$install_status" -ne 0 ]; then
                  safe_output=$(printf '%s' "$install_output" | tr '\n' ' ' | sed 's/%/%25/g')
                  echo "::error title=APK install::$safe_output"
                  exit "$install_status"
                fi
              done
            fi
            if [ "$status" -eq 0 ]; then
              bash .github/scripts/gradle_ci.sh :app:connectedDebugAndroidTest
              status=$?
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error title=P3 Gradle probe::connectedDebugAndroidTest a échoué avec le code $status"
            fi
            exit "$status"
