# Manifeste des jeux téléchargeables — engine « jeux ».
#
# Chaque entrée décrit un jeu que l'application propose d'installer.
# Les binaires (APK) sont publiés via les Releases du dépôt ; l'URL de
# téléchargement peut aussi pointer vers un hébergeur libre (ex. F-Droid).
#
# Champs :
#   id             identifiant stable (slug)
#   title          titre affiché
#   description    texte de la fiche
#   thumbnail_url  vignette (optionnel — sinon carte générique)
#   download_url   URL directe du fichier (Release GitHub, CDN…)
#   size_bytes     taille en octets (affichée à l'utilisateur)
#   sha256         somme de contrôle — vérifiée avant installation
#                  (générer : python engines/jeux/engine.py --hash fichier.apk)
#   package_type   apk | asset | web
#   version_name   ex. "1.2.0"
#   version_code   ex. 12
#   genre          ex. "Puzzle"
#
# Règle de contenu : uniquement des jeux LIBRES (logiciel libre / CC), pour
# rester dans la même exigence de droits que le reste du catalogue.

